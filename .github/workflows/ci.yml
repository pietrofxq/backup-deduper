name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # ---- install -------------------------------------------------------
      - name: Install (root)
        run: npm ci
      - name: Install (web)
        run: npm --prefix web ci

      # ---- lint ----------------------------------------------------------
      # ESLint runs flat-config linting over both packages. Errors fail CI;
      # warnings (e.g. react-refresh/only-export-components on some shared
      # files) are tolerated. Run on all matrix legs so platform-specific
      # source (winLong.ts) gets covered too.
      - name: Lint (server)
        run: npm run lint
      - name: Lint (web)
        run: npm run lint:web

      # ---- typecheck -----------------------------------------------------
      # Server uses the root tsconfig; web is a TS project-references graph
      # (tsc -b) that fans out into app + node configs. Both must pass before
      # tests so a type error at the seam fails fast.
      - name: Typecheck (server)
        run: npm run typecheck
      - name: Typecheck (web)
        run: npm run typecheck:web

      # ---- build ---------------------------------------------------------
      # Verifies that the emit pipeline (tsc + vite + the migrations copy
      # step in the root build script) actually runs to completion. A
      # passing typecheck does not guarantee a passing build — the root
      # build also copies SQL migrations into dist/, and the web build runs
      # vite which can discover issues tsc doesn't (asset resolution, etc.).
      - name: Build (server)
        run: npm run build
      - name: Build (web)
        run: npm run build:web

      # ---- test ----------------------------------------------------------
      - name: Test — server (unit + integration + contract + property)
        run: npm test
        env:
          LOG_LEVEL: silent
      - name: Test — web (component)
        run: npm run test:web

  thorough:
    name: Property test at numRuns=500 (Linux)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Property test (numRuns=500)
        run: npm run test:thorough
        env:
          LOG_LEVEL: silent
